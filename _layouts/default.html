<!doctype html>
<html lang="{{ site.lang | escape }}">
  <head>
    {% include head.html %}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header wrapper">
      <a class="brand" href="{{ '/' | relative_url }}">RadiusDeck<span> / Blog</span></a>
      <nav class="site-nav" aria-label="Main">
        <a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' or page.collection == 'posts' %} aria-current="page"{% endif %}>Guides</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
        <a href="{{ site.product_url }}">GitHub ↗</a>
      </nav>
    </header>
    <main id="main" class="wrapper" tabindex="-1">
      {{ content }}
    </main>
    <footer class="site-footer wrapper">
      <p>Practical notes for FreeRADIUS administrators by the
        <a href="{{ '/about/' | relative_url }}">{{ site.author.name }}</a>.
        <a href="{{ '/feed.xml' | relative_url }}">RSS feed</a>.</p>
    </footer>
  </body>
</html>
