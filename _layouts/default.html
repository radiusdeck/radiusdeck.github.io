<!doctype html>
<html lang="{{ site.lang | escape }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header wrapper">
      <a class="brand" href="{{ '/' | relative_url }}">RadiusDeck<span> / Blog</span></a>
      <a href="https://github.com/radiusdeck/radiusdeck">View project on GitHub ↗</a>
    </header>
    <main id="main" class="wrapper" tabindex="-1">
      {{ content }}
    </main>
    <footer class="site-footer wrapper">
      Practical notes for FreeRADIUS administrators.
    </footer>
  </body>
</html>
